name: Sync obsahu do Sanity

# Ruční, jednorázová oprava datasetu: dosynchronizuje do Sanity texty a popisky
# fotek, které se změnily v kódu. Schválně NEBĚŽÍ po každém pushi - skript
# přepisuje konkrétní pole podle fallback JSONů, takže by majiteli vracel zpátky
# to, co si mezitím ve Studiu upravil. Pouštět jen tehdy, když se v repu záměrně
# přepsaly texty a mají se dostat na web.
#
# Výchozí běh je náhled: vypíše, co by se změnilo, a nic nezapíše. Zápis se
# zapíná přepínačem `write`.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Zapsat změny do datasetu (jinak jen náhled)"
        type: boolean
        default: false

concurrency:
  group: sanity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          WRITE: ${{ inputs.write }}
        run: |
          if [ "$WRITE" != "true" ]; then
            npm run sync:content --workspace studio
            exit 0
          fi

          if [ -z "$SANITY_API_WRITE_TOKEN" ]; then
            echo "::error::SANITY_API_WRITE_TOKEN není nastavený, zápis se nekoná."
            exit 1
          fi

          npm run sync:content --workspace studio -- --write
