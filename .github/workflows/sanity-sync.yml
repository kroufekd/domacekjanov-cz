name: Sync Sanity Studio

# Po každém mergi (1) nasadí schéma na domecek-janov.sanity.studio a (2) doplní
# do datasetu výlety, které v něm ještě nejsou. Zapisuje výhradně přes
# `createIfNotExists`, takže nasazení nikdy nepřepíše to, co majitel ve Studiu
# napsal. Bez tokenu se oba kroky přeskočí, ne že spadnou.
on:
  push:
    branches:
      - master
    paths:
      - "web/src/data/trip-text/**"
      - "studio/**"
      - ".github/workflows/sanity-sync.yml"
  workflow_dispatch:

concurrency:
  group: sanity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nejdřív dokumenty, pak schéma: kdyby deploy Studia selhal, výlety
      # v datasetu už jsou a stačí Studio nasadit ručně.
      - name: Sync trips
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
        run: |
          if [ -z "$SANITY_API_WRITE_TOKEN" ]; then
            echo "::warning::SANITY_API_WRITE_TOKEN není nastavený, synchronizace přeskočena."
            exit 0
          fi
          npm run sync:trips --workspace studio

      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::warning::SANITY_API_WRITE_TOKEN není nastavený, deploy Studia přeskočen."
            exit 0
          fi
          npm run deploy --workspace studio -- --yes
