name: Sync trips to Sanity

# Po každém mergi doplní do datasetu výlety, které v něm ještě nejsou.
# Zapisuje výhradně přes `createIfNotExists`, takže nasazení nikdy nepřepíše to,
# co majitel napsal ve Studiu. Bez tokenu se krok přeskočí, ne že spadne.
on:
  push:
    branches:
      - master
    paths:
      - "web/src/data/trip-text/**"
      - "studio/scripts/**"
      - "studio/schemaTypes/trip.ts"
      - ".github/workflows/sanity-sync.yml"
  workflow_dispatch:

concurrency:
  group: sanity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync trips
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
        run: |
          if [ -z "$SANITY_API_WRITE_TOKEN" ]; then
            echo "::warning::SANITY_API_WRITE_TOKEN není nastavený, synchronizace přeskočena."
            exit 0
          fi
          npm run sync:trips --workspace studio
