name: CI

# Brána před mergem: typy, lint, build obou workspaceů a Playwright.
# Do teď se na master mergovalo bez jediné kontroly.
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI čte obsah z repa, ne ze svazku běžícího webu. Výchozí zdroj je stejně
# `fallback`, ale je to napsané schválně: kdyby se výchozí hodnota někdy
# změnila, testy by začaly záviset na tom, co má klient zrovna na webu.
env:
  CONTENT_SOURCE: fallback

jobs:
  quality:
    name: Typy, lint a build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Testy prochází nad oběma zdroji, takže zelené CI samo o sobě neprozradí,
      # že se proměnná ztratila. Tenhle krok ano.
      - name: Ověřit, že se nečte z běžícího webu
        run: test "$CONTENT_SOURCE" = fallback

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Mapovací testy nepotřebují prohlížeč, takže patří sem, ne mezi e2e -
      # tam by jen nakřivo rozdělily shardy.
      - name: Unit tests
        run: npx playwright test --project=unit
        working-directory: web
        env:
          E2E_NO_SERVER: "1"

  e2e:
    # Běh se dělí mezi dva runnery. Zrychlovat ho víc workery na jednom runneru
    # nešlo - dvě jádra si testy měřící scroll a mapu berou osobně.
    name: Playwright ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ověřit, že se nečte z produkčního CMS
        run: test "$CONTENT_SOURCE" = fallback

      - name: Install dependencies
        run: npm ci

      # Verze Playwrightu je součástí klíče cache: nová verze chce nový build
      # prohlížeče, takže se stará nesmí trefit.
      - name: Zjistit verzi Playwrightu
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache prohlížečů
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Oba projekty (Desktop Chrome i Pixel 5) jedou na Chromiu, víc prohlížečů
      # stahovat nemusíme. Při trefě do cache zbývají jen systémové knihovny.
      - name: Install Chromium for Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: web

      # Playwright si přes webServer sám udělá `npm run build && npm run start`.
      - name: Run E2E tests
        run: >
          npm run test:e2e --workspace web --
          --project=chromium --project=mobile
          --shard=${{ matrix.shard }}/2

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7
